name: Build PDF

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: lagrange.tex

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lagrange-pdf
          path: lagrange.pdf

      - name: Move "latest" tag to this commit
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish PDF in the "latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Najnowsza wersja prezentacji
          body: Automatycznie zbudowany PDF z ostatniego commita.
          files: lagrange.pdf
          make_latest: true
